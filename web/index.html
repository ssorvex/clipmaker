<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>clipmaker</title>
<style>
  :root {
    --bg: #f6f6f4;
    --panel: #ffffff;
    --line: #e2e2dd;
    --ink: #1a1a18;
    --soft: #6b6b64;
    --accent: #1f6feb;
    --accent-ink: #ffffff;
    --good: #15803d;
    --warn: #a16207;
    --bad: #b91c1c;
    --warn-bg: #fdf6e3;
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16161a;
      --panel: #1e1e24;
      --line: #32323b;
      --ink: #ececea;
      --soft: #9a9aa2;
      --accent: #4d8dff;
      --accent-ink: #0b0b0d;
      --good: #4ade80;
      --warn: #fbbf24;
      --bad: #f87171;
      --warn-bg: #2a2416;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16161a; --panel: #1e1e24; --line: #32323b; --ink: #ececea;
    --soft: #9a9aa2; --accent: #4d8dff; --accent-ink: #0b0b0d;
    --good: #4ade80; --warn: #fbbf24; --bad: #f87171; --warn-bg: #2a2416;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }

  header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  header span { color: var(--soft); font-size: 13px; }

  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 16px; margin-top: 16px;
  }
  label { display: block; font-size: 13px; color: var(--soft); margin-bottom: 6px; }
  input[type=text], input[type=number], textarea, select {
    width: 100%; padding: 11px 12px; font: inherit; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line); border-radius: 9px;
  }
  textarea { resize: vertical; min-height: 76px; }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  button {
    font: inherit; font-weight: 600; cursor: pointer; border: 0;
    padding: 12px 18px; border-radius: 9px;
    background: var(--accent); color: var(--accent-ink);
  }
  button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); font-weight: 500; }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .row > * { flex: 1 1 120px; min-width: 0; }
  .row .fixed { flex: 0 0 auto; }

  .note { font-size: 13px; color: var(--soft); margin-top: 10px; }
  .banner {
    font-size: 13px; padding: 10px 12px; border-radius: 9px;
    background: var(--warn-bg); color: var(--warn); border: 1px solid currentColor;
    margin-top: 12px;
  }
  .banner b { color: inherit; }

  details { margin-top: 12px; }
  summary { cursor: pointer; font-size: 14px; color: var(--soft); }
  details[open] summary { margin-bottom: 12px; }

  pre#log {
    margin: 12px 0 0; padding: 12px; max-height: 220px; overflow: auto;
    background: var(--bg); border: 1px solid var(--line); border-radius: 9px;
    font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    white-space: pre-wrap; word-break: break-word;
  }

  .state { font-size: 13px; font-weight: 600; }
  .state.running { color: var(--accent); }
  .state.done { color: var(--good); }
  .state.failed { color: var(--bad); }

  .clip { display: grid; grid-template-columns: 1fr; gap: 14px; }
  @media (min-width: 620px) { .clip { grid-template-columns: 180px 1fr; } }
  .clip video { width: 100%; border-radius: 9px; background: #000; display: block; }
  .meta { min-width: 0; }
  .meta h3 { margin: 0 0 4px; font-size: 15px; }
  .tiny { font-size: 12px; color: var(--soft); }
  .tags { display: flex; gap: 12px; flex-wrap: wrap; margin: 10px 0; font-size: 13px; }
  .tags label { display: inline-flex; align-items: center; gap: 6px; margin: 0; color: var(--ink); }
  .stack > * + * { margin-top: 10px; }
  .result { font-size: 13px; margin-top: 10px; }
  .result a { color: var(--accent); }
  .ok { color: var(--good); }
  .err { color: var(--bad); }
  .hist { font-size: 13px; }
  .hist a { color: var(--accent); cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>clipmaker</h1>
    <span id="picker"></span>
  </header>
  <div class="tiny">Linki yapıştır, dikey klipler çıksın. İşi bu bilgisayar yapar.</div>

  <div id="banners"></div>

  <div class="card">
    <label for="url">YouTube / Twitch / Kick linki</label>
    <input type="text" id="url" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off" inputmode="url">

    <details>
      <summary>Ayarlar</summary>
      <div class="row">
        <div>
          <label for="clips">Kaç klip</label>
          <input type="number" id="clips" value="3" min="1" max="10">
        </div>
        <div>
          <label for="minlen">En kısa (sn)</label>
          <input type="number" id="minlen" value="30" min="5" max="120">
        </div>
        <div>
          <label for="maxlen">En uzun (sn)</label>
          <input type="number" id="maxlen" value="60" min="10" max="180">
        </div>
        <div>
          <label for="crop">Kırpma</label>
          <select id="crop">
            <option value="fill">fill — çerçeveyi doldur</option>
            <option value="blur">blur — bulanık kenar</option>
            <option value="pad">pad — siyah kenar</option>
          </select>
        </div>
      </div>
      <div style="margin-top:12px">
        <label for="direction">Yönlendirme (isteğe bağlı)</label>
        <input type="text" id="direction" placeholder="girişi atla, araba kovalamacalarına ağırlık ver">
      </div>
      <div style="margin-top:12px">
        <label for="cookies">YouTube giriş istiyorsa tarayıcı çerezi</label>
        <select id="cookies">
          <option value="">kullanma</option>
          <option value="chrome">chrome</option>
          <option value="edge">edge</option>
          <option value="firefox">firefox</option>
          <option value="brave">brave</option>
        </select>
      </div>
    </details>

    <div class="row" style="margin-top:14px">
      <button id="go" class="fixed">Klipleri çıkar</button>
      <div class="tiny" id="hint" style="flex:1 1 200px"></div>
    </div>
  </div>

  <div class="card" id="jobcard" hidden>
    <div class="row" style="align-items:center">
      <div class="state fixed" id="state">—</div>
      <div class="tiny" id="jobmeta" style="flex:1 1 auto"></div>
    </div>
    <pre id="log"></pre>
  </div>

  <div id="clips"></div>

  <div class="card hist" id="histcard" hidden>
    <label>Önceki işler</label>
    <div id="hist"></div>
  </div>

</div>

<script>
(function () {
  "use strict";

  var TOKEN = new URLSearchParams(location.search).get("t") || "";
  var jobId = null;
  var timer = null;
  var env = { llm: false, accounts: { ok: false, connected: [] } };

  function api(path) { return path + (TOKEN ? (path.indexOf("?") < 0 ? "?" : "&") + "t=" + encodeURIComponent(TOKEN) : ""); }

  function el(tag, attrs, kids) {
    var node = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === "class") node.className = attrs[k];
      else if (k === "text") node.textContent = attrs[k];
      else if (k === "html") node.innerHTML = attrs[k];
      else node.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (kid) { if (kid) node.appendChild(kid); });
    return node;
  }

  function get(path) {
    return fetch(api(path)).then(function (r) { return r.json(); });
  }
  function post(path, body) {
    return fetch(api(path), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }).then(function (r) { return r.json(); });
  }

  // ---- startup ---------------------------------------------------------- //

  get("/api/env").then(function (got) {
    env = got;
    document.getElementById("picker").textContent =
      got.llm ? "klipleri Claude seçiyor" : "klipleri yerel program seçiyor";

    var holder = document.getElementById("banners");
    holder.innerHTML = "";

    if (!got.llm) {
      holder.appendChild(el("div", { class: "banner", html:
        "<b>Klip seçimi zayıf modda.</b> API anahtarı yok, o yüzden anları ses yüksekliğine ve konuşma hızına bakan yerel program seçiyor &mdash; ilginç olanı değil. Anahtar eklenirse ayda yaklaşık $4&ndash;7 ile Claude seçer." }));
    }
    if (!got.accounts.ok) {
      holder.appendChild(el("div", { class: "banner", html:
        "<b>Paylaşım kapalı.</b> " + escapeHtml(got.accounts.reason || "WoopSocial bağlı değil.") }));
    } else if (got.accounts.connected.length) {
      document.getElementById("hint").textContent =
        "Bağlı: " + got.accounts.connected.join(", ");
    }
  });

  loadHistory();

  function escapeHtml(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  // ---- starting a job --------------------------------------------------- //

  document.getElementById("go").addEventListener("click", function () {
    var url = document.getElementById("url").value.trim();
    if (!/^https?:\/\//.test(url)) {
      alert("Bir link yapıştır (https:// ile başlayan).");
      return;
    }
    setBusy(true);
    post("/api/start", {
      url: url,
      clips: +document.getElementById("clips").value || 3,
      min_len: +document.getElementById("minlen").value || 30,
      max_len: +document.getElementById("maxlen").value || 60,
      crop: document.getElementById("crop").value,
      direction: document.getElementById("direction").value.trim(),
      cookies: document.getElementById("cookies").value
    }).then(function (got) {
      if (got.error) { alert(got.error); setBusy(false); return; }
      watch(got.id);
      loadHistory();
    }).catch(function (e) { alert(String(e)); setBusy(false); });
  });

  function setBusy(busy) {
    document.getElementById("go").disabled = busy;
    document.getElementById("go").textContent = busy ? "Çalışıyor…" : "Klipleri çıkar";
  }

  function watch(id) {
    jobId = id;
    document.getElementById("jobcard").hidden = false;
    document.getElementById("clips").innerHTML = "";
    if (timer) clearInterval(timer);
    tick();
    timer = setInterval(tick, 1500);
  }

  function tick() {
    if (!jobId) return;
    get("/api/job?id=" + encodeURIComponent(jobId)).then(function (job) {
      if (job.error) { clearInterval(timer); return; }

      var state = document.getElementById("state");
      state.className = "state fixed " + job.state;
      state.textContent = ({
        starting: "başlıyor", running: "çalışıyor", done: "bitti", failed: "hata"
      })[job.state] || job.state;

      var secs = Math.round(Date.now() / 1000 - job.started);
      document.getElementById("jobmeta").textContent =
        job.url + "  ·  " + secs + " sn" + (job.error ? "  ·  " + job.error : "");

      var log = document.getElementById("log");
      var atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 20;
      log.textContent = (job.lines || []).join("\n");
      if (atBottom) log.scrollTop = log.scrollHeight;

      if (job.state === "done" || job.state === "failed") {
        clearInterval(timer);
        setBusy(false);
        if (job.state === "done") showClips(job.clips || []);
        loadHistory();
      }
    });
  }

  // ---- the finished clips ----------------------------------------------- //

  function showClips(clips) {
    var holder = document.getElementById("clips");
    holder.innerHTML = "";
    if (!clips.length) {
      holder.appendChild(el("div", { class: "card tiny", text: "Klip bulunamadı." }));
      return;
    }
    clips.forEach(function (clip) { holder.appendChild(clipCard(clip)); });
  }

  function clipCard(clip) {
    var video = el("video", {
      src: api("/api/video?id=" + encodeURIComponent(jobId) + "&n=" + clip.n),
      controls: "controls", preload: "metadata", playsinline: "playsinline"
    });

    var title = el("input", { type: "text", value: clip.title, id: "t" + clip.n });
    var text = el("textarea", { id: "d" + clip.n });
    text.value = clip.description + (clip.hashtags.length
      ? "\n\n" + clip.hashtags.map(function (t) { return "#" + t; }).join(" ") : "");

    var boxes = el("div", { class: "tags" });
    ["tiktok", "instagram", "youtube"].forEach(function (name) {
      var connected = (env.accounts.connected || []).indexOf(name) >= 0;
      var box = el("input", { type: "checkbox", value: name });
      box.checked = connected;
      if (!connected) box.disabled = true;
      var lab = el("label", {}, [box, el("span", { text: name + (connected ? "" : " (bağlı değil)") })]);
      boxes.appendChild(lab);
    });

    var out = el("div", { class: "result" });
    var send = el("button", { text: "Paylaş" });
    if (!env.accounts.ok) send.disabled = true;

    send.addEventListener("click", function () {
      var picked = [].slice.call(boxes.querySelectorAll("input:checked"))
        .map(function (b) { return b.value; });
      if (!picked.length) { out.textContent = "Hiç platform seçili değil."; return; }
      if (!confirm("Bu klip şu platformlarda HERKESE AÇIK paylaşılacak:\n\n  " +
                   picked.join(", ") + "\n\nDevam?")) return;

      send.disabled = true;
      send.textContent = "Gönderiliyor…";
      out.textContent = "";
      post("/api/post", {
        id: jobId, n: clip.n, platforms: picked,
        title: title.value, text: text.value
      }).then(function (got) {
        send.textContent = "Paylaş";
        if (got.error) {
          out.innerHTML = '<span class="err">' + escapeHtml(got.error) + "</span>";
          send.disabled = false;
          return;
        }
        out.innerHTML = (got.results || []).map(function (r) {
          var good = /PUBLISH|SUCCESS|DONE|COMPLETE/.test(r.status);
          return '<div class="' + (good ? "ok" : "err") + '">' +
            escapeHtml(r.platform) + ": " + escapeHtml(r.status) +
            (r.url ? ' <a href="' + escapeHtml(r.url) + '" target="_blank" rel="noopener">aç</a>' : "") +
            (r.error ? " — " + escapeHtml(r.error) : "") + "</div>";
        }).join("") || '<span class="ok">gönderildi</span>';
      }).catch(function (e) {
        send.textContent = "Paylaş";
        send.disabled = false;
        out.innerHTML = '<span class="err">' + escapeHtml(String(e)) + "</span>";
      });
    });

    var meta = el("div", { class: "meta stack" }, [
      el("h3", { text: clip.n + ". " + clip.title }),
      el("div", { class: "tiny", text:
        clip.duration + " sn · " + clip.size_mb + " MB · kaynakta " + fmt(clip.start) }),
      clip.why ? el("div", { class: "tiny", text: clip.why }) : null,
      el("div", {}, [el("label", { for: "t" + clip.n, text: "Başlık" }), title]),
      el("div", {}, [el("label", { for: "d" + clip.n, text: "Açıklama + etiketler" }), text]),
      boxes,
      el("div", {}, [send]),
      out
    ]);

    return el("div", { class: "card clip" }, [video, meta]);
  }

  function fmt(sec) {
    sec = Math.round(sec || 0);
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + ":" + (s < 10 ? "0" : "") + s;
  }

  // ---- history ---------------------------------------------------------- //

  function loadHistory() {
    get("/api/jobs").then(function (got) {
      var rows = got.jobs || [];
      var card = document.getElementById("histcard");
      if (!rows.length) { card.hidden = true; return; }
      card.hidden = false;
      var holder = document.getElementById("hist");
      holder.innerHTML = "";
      rows.forEach(function (row) {
        var when = new Date(row.started * 1000).toLocaleTimeString("tr-TR",
          { hour: "2-digit", minute: "2-digit" });
        var link = el("a", { text: row.url.slice(0, 54) });
        link.addEventListener("click", function () { watch(row.id); });
        holder.appendChild(el("div", {}, [
          el("span", { class: "tiny", text: when + "  " + row.state + "  " }), link
        ]));
      });
    });
  }
})();
</script>
</body>
</html>
